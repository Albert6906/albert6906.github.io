name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A63831: ${{ secrets.A63831 }}
          BFDDB3: ${{ secrets.BFDDB3 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A63831', '')
          bm = os.environ.get('BFDDB3', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 8ceafeef97457f22 -->', gm)
          if bm:
              s2 = s2.replace('<!-- f8e4ad0a5a95725304d365d77b24acea2060 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
